<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英語遊戲樂園 第 3、4 課</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fff7ea; --card:#ffffff; --ink:#2b2a28; --muted:#6c675e; --line:#e3d6bf;
  --accent:#ee7d31; --accent-ink:#ffffff; --blue:#2f78c8; --good:#2e9d57; --bad:#d9534f;
  --sky:#cfe9ff; --grass:#cfeec0; --soft:#fff1d9;
  --shadow:0 6px 0 rgba(0,0,0,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1e1c19; --card:#2b2824; --ink:#f4efe6; --muted:#b9b2a4; --line:#4a443b;
    --accent:#f2873c; --blue:#6aa8ee; --sky:#27425c; --grass:#2f4a2a; --soft:#3a342a;
    --shadow:0 6px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1e1c19; --card:#2b2824; --ink:#f4efe6; --muted:#b9b2a4; --line:#4a443b;
  --accent:#f2873c; --blue:#6aa8ee; --sky:#27425c; --grass:#2f4a2a; --soft:#3a342a;
  --shadow:0 6px 0 rgba(0,0,0,.35);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  font-size:18px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}
.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.btn{
  min-height:64px;padding:10px 22px;border-radius:20px;border:3px solid var(--line);
  background:var(--card);font-size:1.15rem;font-weight:700;box-shadow:var(--shadow);
}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;box-shadow:none}

/* ---------- home ---------- */
.home{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
.home h1{margin:6px 0 4px;font-size:2rem;text-align:center}
.home .hint{text-align:center;color:var(--muted);margin:0 0 20px}
.lesson{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:16px;margin:0 0 20px;box-shadow:var(--shadow)}
.lesson h2{margin:0 0 12px;font-size:1.4rem}
.lesson h2 .tag{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 14px;margin-right:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tile{
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 10px;border-radius:24px;
  border:3px solid var(--line);background:var(--soft);box-shadow:var(--shadow);text-align:center;
}
.tile:active{transform:translateY(3px);box-shadow:none}
.tile .ic{font-size:3.4rem;line-height:1.1}
.tile .zh{font-size:1.35rem;font-weight:800}
.tile .en{font-size:.95rem;color:var(--muted)}
.tile .st{font-size:1.2rem;letter-spacing:2px;min-height:1.6em}

/* ---------- game shell ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:10px 14px;position:sticky;top:0;background:var(--bg);z-index:20;border-bottom:3px solid var(--line)}
.bar .ttl{flex:1;font-size:1.3rem;font-weight:800;text-align:center}
.bar .score{min-width:90px;text-align:right;font-size:1.3rem;font-weight:800}
.stage{max-width:900px;margin:0 auto;padding:14px 14px 40px}
.prompt{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 14px}
.bigitem{font-size:4.6rem;line-height:1}
.say{min-width:84px;font-size:2rem}
.caption{text-align:center;font-size:1.5rem;font-weight:800;min-height:2.2em;color:var(--blue)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}

/* ---------- rooms ---------- */
.roof{width:100%;max-width:760px;margin:0 auto -6px;height:64px;background:var(--accent);clip-path:polygon(50% 0,100% 100%,0 100%)}
.house{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-width:760px;margin:0 auto}
.room{
  grid-column:span 2;min-height:150px;border-radius:20px;border:4px solid rgba(0,0,0,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;color:#2b2a28;
  box-shadow:var(--shadow);
}
.room:nth-child(n+4){grid-column:span 3}
.room:active{transform:translateY(3px);box-shadow:none}
.room .re{font-size:3rem;line-height:1}
.room .rl{font-size:1.05rem;font-weight:800}
.room .rz{font-size:.95rem;opacity:.75}
.room .drop{position:absolute;right:10px;top:6px;font-size:2.6rem;line-height:1}

/* ---------- treasure scene ---------- */
.scene{position:relative;max-width:760px;height:min(52vh,420px);min-height:300px;margin:0 auto;border-radius:26px;overflow:hidden;
  background:linear-gradient(var(--sky) 0 38%,var(--grass) 38% 100%);border:4px solid var(--line)}
.obj{position:absolute;transform:translate(-50%,-50%);line-height:1;pointer-events:none}
.spot{position:absolute;transform:translate(-50%,-50%);border:4px dashed var(--accent);border-radius:50%;
  background:rgba(255,255,255,.6);display:grid;place-items:center;padding:0;color:#2b2a28}
.spot:active{background:rgba(255,255,255,.9)}

/* ---------- bingo ---------- */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:560px;margin:0 auto}
.cell{aspect-ratio:1/1;border-radius:22px;border:4px solid var(--line);background:var(--card);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.cell .ce{font-size:3.6rem;line-height:1}
.cell .cl{font-size:.9rem;color:var(--muted);font-weight:700}
.cell.on{background:#ffe9a8;border-color:#e0a800;color:#2b2a28}
.cell.on .cl{color:#5c4a00}
.cell .mk{position:absolute;right:6px;top:2px;font-size:2rem}
.banner{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);
  font-size:2.6rem;font-weight:900;border-radius:28px;padding:14px 34px;z-index:60;box-shadow:var(--shadow)}

/* ---------- traffic lights ---------- */
.tl{width:110px;margin:0 auto 14px;background:#222;border-radius:30px;padding:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.tl i{display:block;width:70px;height:70px;border-radius:50%;background:#4a4a4a}
[data-light="red"] .tl .r{background:#ff3b30;box-shadow:0 0 24px #ff3b30}
[data-light="green"] .tl .g{background:#34c759;box-shadow:0 0 24px #34c759}
.track{position:relative;height:96px;margin:10px 10px 24px;border-radius:48px;border:3px solid var(--line);background:var(--card);
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(10% - 3px),var(--line) calc(10% - 3px) 10%)}
.walker{position:absolute;transform:translate(-50%,-50%);font-size:3rem;line-height:1;transition:left .35s,top .6s;z-index:5;pointer-events:none}
.goal{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:3rem;line-height:1}
.gobtn{display:block;margin:0 auto;width:190px;height:190px;border-radius:50%;border:6px solid rgba(0,0,0,.15);background:var(--accent);
  color:var(--accent-ink);font-size:2.6rem;font-weight:900;box-shadow:0 10px 0 rgba(0,0,0,.18)}
.gobtn:active{transform:translateY(6px);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.watch{position:fixed;left:50%;top:30%;transform:translateX(-50%);background:var(--bad);color:#fff;font-size:2.4rem;font-weight:900;
  border-radius:24px;padding:12px 30px;z-index:60}

/* ---------- street ---------- */
.street{position:relative;max-width:820px;height:min(58vh,440px);min-height:320px;margin:0 auto;border-radius:26px;overflow:hidden;border:4px solid var(--line);background:#cfcfd4}
.street .zone{position:absolute;left:0;right:0;border:0;padding:0;background:transparent;border-radius:0}
.street .sw1{top:0;height:24%;background:#cfcfd4}
.street .rd{top:24%;height:52%;background:#4a4a4f}
.street .sw2{top:76%;height:24%;background:#cfcfd4}
.street .lane{position:absolute;left:0;right:0;top:50%;height:6px;background:repeating-linear-gradient(90deg,#fff 0 36px,transparent 36px 72px);pointer-events:none}
.street .zebra{position:absolute;top:24%;height:52%;left:42%;width:16%;border:0;padding:0;
  background:repeating-linear-gradient(0deg,#fff 0 16px,#4a4a4f 16px 32px)}
.street .lights{position:absolute;left:8%;top:2%;font-size:3.2rem;line-height:1;border:0;background:transparent;padding:4px 8px}
.street .car{position:absolute;font-size:3rem;line-height:1;pointer-events:none}
.street .hl{outline:5px solid #ffd60a;outline-offset:-5px}

/* ---------- simon ---------- */
.teacher{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 8px}
.teacher .tc{font-size:4.4rem;line-height:1}
.bubble{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:10px 18px;min-width:230px;min-height:86px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.bubble .sb{font-size:1.5rem;font-weight:900;color:var(--accent)}
.bubble .tx{color:var(--muted);font-size:1.1rem;font-weight:700}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.act{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px;border-radius:22px;border:3px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.act:active{transform:translateY(3px);box-shadow:none}
.act .ae{font-size:3rem;line-height:1.1}
.act .al{font-weight:800}
.act .az{font-size:.95rem;color:var(--muted)}
.act.still{background:#ffe3e0;border-color:#e08a82;color:#2b2a28}
.act.still .az{color:#7a3a34}
.doit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:7rem;z-index:50;pointer-events:none}

/* ---------- phonics ---------- */
.pcard{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:3px solid var(--line);border-radius:24px;padding:12px 22px;box-shadow:var(--shadow);min-width:190px}
.pe{font-size:4.2rem;line-height:1.1}
.pl{font-size:1.3rem;font-weight:800;font-family:Verdana,"DejaVu Sans",sans-serif}
.fl{color:var(--accent);font-size:1.15em;font-weight:900}
.tgrow{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;max-width:780px;margin:14px auto 0}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px 8px;min-height:150px;border-radius:24px;border:4px solid var(--line);background:var(--card);box-shadow:var(--shadow);position:relative}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt.ok{background:#d7f5df;border-color:var(--good);color:#2b2a28}
.opt .drop{position:absolute;right:10px;top:6px;font-size:2.4rem;line-height:1}
.opt .lt{font-family:Verdana,"DejaVu Sans",sans-serif;font-size:4.6rem;font-weight:700;line-height:1}
.opt .nm{font-size:1rem;font-weight:700;color:var(--muted);font-family:Verdana,"DejaVu Sans",sans-serif}
.opt.ok .nm{color:#444}
.grps{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:680px;margin:16px auto 0}
.grps .opt{min-height:190px}

/* ---------- finish overlay ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:100;padding:20px}
.overlay .card{background:var(--card);border-radius:32px;padding:26px 30px;text-align:center;max-width:460px;width:100%;border:4px solid var(--accent)}
.overlay .big{font-size:5rem;line-height:1}
.overlay .stars{font-size:3rem;letter-spacing:6px;margin:6px 0}
.overlay .msg{font-size:1.8rem;font-weight:900;margin-bottom:16px}
.overlay .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

/* ================= helpers ================= */
var app = document.getElementById('app');
function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function rand(a,b){ return a + Math.random()*(b-a); }

var store = {
  get: function(){ try { return JSON.parse(localStorage.getItem('eng-games-l3l4') || '{}'); } catch(e){ return {}; } },
  set: function(o){ try { localStorage.setItem('eng-games-l3l4', JSON.stringify(o)); } catch(e){} }
};

/* ---------- speech ---------- */
var voice = null;
var hasSpeech = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
function pickVoice(){
  if (!hasSpeech) return;
  var vs = window.speechSynthesis.getVoices() || [];
  voice = null;
  for (var i=0;i<vs.length;i++){ if (/^en[-_]US/i.test(vs[i].lang)) { voice = vs[i]; break; } }
  if (!voice) for (var k=0;k<vs.length;k++){ if (/^en/i.test(vs[k].lang)) { voice = vs[k]; break; } }
}
if (hasSpeech){ pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, rate){
  if (!hasSpeech) return;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; if (voice) u.voice = voice;
    u.rate = rate || 0.8; u.pitch = 1.05;
    window.speechSynthesis.speak(u);
  } catch(e){}
}

function sayq(list, rate){
  if (!hasSpeech) return;
  try {
    window.speechSynthesis.cancel();
    list.forEach(function(t){
      var u = new SpeechSynthesisUtterance(t);
      u.lang = 'en-US'; if (voice) u.voice = voice;
      u.rate = rate || 0.8; u.pitch = 1.05;
      window.speechSynthesis.speak(u);
    });
  } catch(e){}
}

/* ---------- sound effects ---------- */
var actx = null;
function beep(freqs, dur, type, vol){
  try {
    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    actx = actx || new AC();
    if (actx.state === 'suspended') actx.resume();
    var t = actx.currentTime;
    freqs.forEach(function(f,i){
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(vol || 0.15, t + i*dur);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (i+1)*dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t + i*dur); o.stop(t + (i+1)*dur + 0.02);
    });
  } catch(e){}
}
function ding(){ beep([660,880,1100], 0.09); }
function buzz(){ beep([200,150], 0.13, 'square', 0.07); }
function cheer(){ beep([523,659,784,1047], 0.13); }

/* ---------- screen / timers ---------- */
var current = { timers: [] };
function later(fn, ms){ var id = setTimeout(fn, ms); current.timers.push(id); return id; }
function every(fn, ms){ var id = setInterval(fn, ms); current.timers.push(id); return id; }
function go(screen){
  (current.timers||[]).forEach(function(id){ clearTimeout(id); clearInterval(id); });
  current = { timers: [] };
  if (hasSpeech) { try { window.speechSynthesis.cancel(); } catch(e){} }
  $$('.overlay,.banner,.watch').forEach(function(e){ e.remove(); });
  screen();
  window.scrollTo(0,0);
}
function shell(title, icon, body){
  app.innerHTML =
    '<header class="bar"><button class="btn ghost" id="home" aria-label="回首頁"><span class="emoji">🏠</span></button>' +
    '<div class="ttl"><span class="emoji">'+icon+'</span> '+title+'</div><div class="score" id="score"></div></header>' +
    '<main class="stage" id="stage">'+body+'</main>';
  $('#home').addEventListener('click', function(){ go(home); });
}
function setScore(t){ var s = $('#score'); if (s) s.textContent = t; }
function bump(el, cls){ if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

function finish(id, mistakes, replay){
  var stars = mistakes === 0 ? 3 : (mistakes <= 2 ? 2 : 1);
  var s = store.get(); s[id] = Math.max(s[id]||0, stars); store.set(s);
  cheer(); say('Great job!');
  var o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = '<div class="card"><div class="big emoji">🎉</div><div class="stars emoji">'+
    new Array(stars+1).join('⭐') + new Array(4-stars).join('☆') +
    '</div><div class="msg">Great job!</div><div class="row">' +
    '<button class="btn primary" id="again"><span class="emoji">🔁</span> 再玩一次</button>' +
    '<button class="btn" id="back"><span class="emoji">🏠</span> 回首頁</button></div></div>';
  document.body.appendChild(o);
  $('#again').addEventListener('click', function(){ go(replay); });
  $('#back').addEventListener('click', function(){ go(home); });
}

/* ================= home ================= */
function home(){
  var st = store.get();
  function stars(id){ var n = st[id]||0; return new Array(n+1).join('⭐') + new Array(4-n).join('☆'); }
  var lessons = [
    { n:3, title:'房間與位置', games:[
      { id:'rooms', ic:'🏠', zh:'小屋擺放', en:'Put it in the room', fn:gRooms },
      { id:'treasure', ic:'💎', zh:'找寶藏', en:'Where is it?', fn:gTreasure },
      { id:'bingo', ic:'🎯', zh:'圖片賓果', en:'Picture Bingo', fn:gBingo } ]},
    { n:4, title:'馬路與聽指令', games:[
      { id:'lights', ic:'🚦', zh:'紅燈綠燈', en:'Traffic Lights', fn:gLights },
      { id:'road', ic:'🚸', zh:'過馬路', en:'Cross the Road', fn:gRoad },
      { id:'simon', ic:'👩‍🏫', zh:'老師說', en:'Simon Says', fn:gSimon } ]},
    { tag:'加強', title:'字首發音', games:[
      { id:'same', ic:'🧩', zh:'找朋友', en:'Same Beginning Sound', fn:gSame },
      { id:'sort', ic:'🗂️', zh:'聽音分類', en:'Sort by Sound', fn:gSort },
      { id:'letter', ic:'🔤', zh:'認字母', en:'Letter & Sound', fn:gLetter } ]}
  ];
  var html = '<div class="home"><h1><span class="emoji">🎮</span> 英語遊戲樂園</h1><p class="hint"><span class="emoji">🔊</span> 請把平板的音量開大，聽聽看，再點一點！</p>';
  lessons.forEach(function(L){
    html += '<section class="lesson"><h2><span class="tag">'+(L.tag || ('第 '+L.n+' 課'))+'</span>'+L.title+'</h2><div class="tiles">';
    L.games.forEach(function(g){
      html += '<button class="tile" data-g="'+g.id+'"><span class="ic emoji">'+g.ic+'</span><span class="zh">'+g.zh+'</span><span class="en">'+g.en+'</span><span class="st emoji">'+stars(g.id)+'</span></button>';
    });
    html += '</div></section>';
  });
  html += '</div>';
  app.innerHTML = html;
  lessons.forEach(function(L){ L.games.forEach(function(g){
    $('[data-g="'+g.id+'"]').addEventListener('click', function(){ go(g.fn); });
  }); });
}

/* ================= L3-1 Put it in the room ================= */
var ROOMS = [
  { id:'living room', e:'🛋️', zh:'客廳', c:'#cfe3ff' },
  { id:'dining room', e:'🍽️', zh:'飯廳', c:'#ffe0b8' },
  { id:'kitchen', e:'🍳', zh:'廚房', c:'#fff3b0' },
  { id:'bedroom', e:'🛏️', zh:'臥室', c:'#e2d4ff' },
  { id:'bathroom', e:'🛁', zh:'浴室', c:'#c8f1ec' }
];
function gRooms(){
  var items = [['🧸','bear'],['🐱','cat'],['🐶','dog'],['⚽','ball'],['🍎','apple']];
  var order = shuffle(ROOMS.concat(ROOMS));
  var i = 0, mistakes = 0, locked = false, q = null;
  var h = '<div class="prompt"><div class="bigitem emoji" id="item"></div><button class="btn say" id="rep" aria-label="再聽一次"><span class="emoji">🔊</span></button></div>' +
          '<div class="roof"></div><div class="house">';
  ROOMS.forEach(function(r){
    h += '<button class="room" data-id="'+r.id+'" style="background:'+r.c+'"><span class="re emoji">'+r.e+'</span><span class="rl">'+r.id+'</span><span class="rz">'+r.zh+'</span><span class="drop emoji"></span></button>';
  });
  h += '</div>';

/* ================= Phonics: beginning sounds ================= */
var PH = {
  b:{ anchor:['🧸','bear'], words:[['🛏️','bedroom'],['🛁','bathroom'],['⚽','ball'],['📦','box'],['🚌','bus']] },
  s:{ anchor:['☀️','sun'],  words:[['🛋️','sofa'],['🎵','song'],['📱','smartphone'],['🐍','snake']] },
  t:{ anchor:['🌳','tree'], words:[['🔧','tool'],['🚦','traffic lights'],['🐯','tiger'],['🐢','turtle']] },
  d:{ anchor:['🐶','dog'],  words:[['🚪','door'],['🍽️','dining room'],['🐉','dragon'],['🦆','duck']] },
  f:{ anchor:['🦊','fox'],  words:[['🐟','fish'],['🌸','flower'],['🍴','fork'],['🐸','frog']] },
  k:{ anchor:['🍳','kitchen'], words:[['🔑','key'],['👑','king'],['🐨','koala']] }
};
var PH_KEYS = ['b','s','t','d','f','k'];
function bdClash(a, b){ return (a === 'b' && b === 'd') || (a === 'd' && b === 'b'); }
function pool(k){ return [PH[k].anchor].concat(PH[k].words); }
function lab(w){ return '<b class="fl">' + w.charAt(0) + '</b>' + w.slice(1); }
function pickOthers(x, n){
  var c = shuffle(PH_KEYS.filter(function(k){ return k !== x && !bdClash(k, x); }));
  var res = [];
  for (var i = 0; i < c.length && res.length < n; i++){
    var ok = res.every(function(r){ return !bdClash(r, c[i]); });
    if (ok) res.push(c[i]);
  }
  return res;
}
function pcard(w, showLabel){
  return '<div class="pcard"><span class="pe emoji">' + w[0] + '</span><span class="pl">' + (showLabel ? lab(w[1]) : '&nbsp;') + '</span></div>';
}

    $$('.opt').forEach(function(b){
      b.addEventListener('click', function(){
        if (locked) return;
        var l = b.getAttribute('data-l');
        if (l === q.x){
          locked = true; ding(); b.classList.add('ok');
          $('#tg').innerHTML = pcard(q.w, true);
          $('#cap').innerHTML = lab(q.w[1]);
          sayq([q.w[1], 'starts with ' + q.x]);
          i++; setScore(i+'/'+rounds.length);
          later(function(){ if (i >= rounds.length) finish('letter', mistakes, gLetter); else ask(); }, 2400);
        } else {
          mistakes++; buzz(); bump(b, 'shake');
          later(function(){ sayq([q.w[1]]); }, 450);
        }
      });
    });
  }
  $('#rep').addEventListener('click', function(){ if (q) prompt(); });
  ask();
}

home();
})();
</script>
</body>
</html>
